version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - postgres_pembekalan_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      pembekalan-network:
        ipv4_address: 192.3.0.254
  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "${RDPORT}:6379"
    command: redis-server --requirepass ${RDPASS} --appendonly yes
    volumes:
      - redis_pembekalan_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      pembekalan-network:
        ipv4_address: 192.3.0.253
  # Web Application Service (Full-Stack React + Express Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT}:3000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      pembekalan-network:
        ipv4_address: 192.3.0.10

volumes:
  postgres_pembekalan_data:
    driver: local
  redis_pembekalan_data:
    driver: local
networks:
  pembekalan-network:
    external: True
